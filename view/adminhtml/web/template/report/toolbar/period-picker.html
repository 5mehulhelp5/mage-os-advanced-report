<div class="advancedreport-control advancedreport-period advancedreport-dropdown" data-bind="advancedreportDropdown: {open: open}">
    <button type="button" class="advancedreport-dropdown-toggle" aria-haspopup="true" aria-expanded="false">
        <span class="advancedreport-period-icon" aria-hidden="true">&#128197;</span>
        <span data-bind="text: buttonLabel"></span>
    </button>
    <div class="advancedreport-dropdown-panel" hidden>
        <ul class="advancedreport-period-options" role="listbox" data-bind="attr: {'aria-label': label}">
            <!-- ko foreach: options -->
            <li role="option" tabindex="0" class="advancedreport-period-option"
                data-bind="text: label, click: $parent.select, css: {'_selected': $parent.isSelected($data)}, attr: {'aria-selected': $parent.isSelected($data) ? 'true' : 'false', 'aria-checked': $parent.isSelected($data) ? 'true' : 'false'}, event: {keydown: function (d, e) { if (e.key === 'Enter' || e.key === ' ') { $parent.select(d); return false; } return true; }}"></li>
            <!-- /ko -->
            <li role="option" tabindex="0" class="advancedreport-period-option"
                data-bind="text: customLabel, click: showCustom, css: {'_selected': isCustom}, attr: {'aria-selected': isCustom() ? 'true' : 'false', 'aria-checked': isCustom() ? 'true' : 'false'}, event: {keydown: function (d, e) { if (e.key === 'Enter' || e.key === ' ') { showCustom(); return false; } return true; }}"></li>
        </ul>
        <!-- ko if: customOpen -->
        <div class="advancedreport-period-custom">
            <label class="admin__field-label"><span data-bind="text: fromLabel"></span>
                <input type="date" class="admin__control-text" data-bind="value: draftFrom"/>
            </label>
            <label class="admin__field-label"><span data-bind="text: toLabel"></span>
                <input type="date" class="admin__control-text" data-bind="value: draftTo"/>
            </label>
            <p class="advancedreport-period-error" role="alert" data-bind="visible: error, text: error"></p>
            <button type="button" class="action-default primary" data-bind="click: apply, text: applyLabel"></button>
        </div>
        <!-- /ko -->
    </div>
</div>
